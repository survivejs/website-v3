<BaseLayout>
  <slot name="content">
    <div
      class="mx-auto px-4 pt-6 md:px-6 md:pt-0 w-full max-w-6xl flex flex-col gap-10 md:gap-12"
    >
      <PageIntro
        title="Blog topics"
        summary="Browse interviews and articles by technology or theme."
      />
      <div
        class="grid grid-cols-1 sm:grid-cols-2 gap-8 not-prose"
        &foreach="(get context topics)"
      >
        <Card>
          <slot name="header">
            <SiteLink
              &href="(get props slug)"
              &children="(concat (get props title) ' ' '(' (length (get props posts)) ')')"
            ></SiteLink>
          </slot>
        </Card>
      </div>
    </div>
  </slot>
</BaseLayout>
