<form
  id="thesis-filters"
  data-research-filter="thesis-results"
  data-noun="theses"
  hidden
  class="flex flex-col gap-3"
>
  <div
    role="group"
    aria-label="Thesis type"
    data-degree-chips
    class="flex flex-wrap gap-2"
  ></div>
  <div
    role="group"
    aria-label="Filter theses by topic"
    data-topic-chips
    class="flex flex-wrap gap-2"
  ></div>
  <div
    class="flex flex-wrap items-center justify-between gap-x-4 text-sm text-muted"
  >
    <p role="status" aria-live="polite" aria-atomic="true"></p>
    <button type="reset" hidden class="underline min-h-11 cursor-pointer">
      Clear filters
    </button>
  </div>
  <details>
    <summary class="cursor-pointer text-sm text-muted underline w-fit py-2">
      Search theses
    </summary>
    <input
      type="search"
      name="query"
      aria-label="Search theses"
      placeholder="Title, student, or year"
      aria-controls="thesis-results"
      class="mt-2 bg-white border p-2 min-h-11 w-full sm:max-w-sm"
    />
  </details>
</form>
