<div class="xl:h-auto bg-secondary h-10">
  <div class="xl:px-8 xl:py-4">
    <div class="xl:hidden absolute left-0 p-2 flex flex-row gap-8">
      <SiteLink href="/">Home</SiteLink>
      <button
        type="button"
        data-search-toggle
        aria-controls="site-search"
        aria-expanded="false"
        class="cursor-pointer text-muted hover:text-primary"
      >
        Search
      </button>
    </div>
    <button
      type="button"
      id="navigation-toggle"
      aria-controls="site-navigation"
      aria-expanded="false"
      aria-label="Toggle navigation"
      class="xl:hidden p-2 pointer-events-all absolute right-0 w-10 h-10 rounded-full flex z-50"
    >
      <span aria-hidden="true" class="w-4 h-4 leading-4 m-auto text-2xl"
        >☰</span
      >
    </button>
    <nav
      id="site-navigation"
      aria-label="Main navigation"
      hidden
      class="absolute top-10 xl:top-auto bg-secondary p-4 xl:p-0 xl:relative w-full flex flex-col gap-4 lg:gap-8 lg:flex-row"
    >
      <div
        class="xl:w-full flex flex-col flex-wrap xl:flex-row xl:justify-between gap-4 text-lg"
      >
        <div class="grid xl:flex xl:flex-row gap-4 xl:gap-8 xl:mr-auto">
          <Navigation class="!no-underline" />
        </div>
        <div class="grid xl:flex xl:flex-row gap-4 xl:gap-8 xl:ml-auto">
          <button
            type="button"
            data-search-toggle
            aria-controls="site-search"
            aria-expanded="false"
            class="cursor-pointer text-muted hover:text-primary hidden xl:inline"
          >
            Search
          </button>
          <SiteLink class="!no-underline" href="/about-me/">About me</SiteLink>
        </div>
      </div>
      <div
        class="xl:hidden"
        &visibleIf="(get props aside)"
        &children="(get props aside)"
      />
    </nav>
  </div>
</div>
